name: Build 4x6 Vial (Clean Baseline)
on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli@sha256:16c4916e95b99bf88d27b15aec8db409ee17265d1710287fde248c6666508966

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: recursive

    - name: Build firmware
      run: |
        git config --global --add safe.directory $(pwd)
        qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial

    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: Charybdis_4x6_Vial_Clean
        path: |
          *.uf2
          *.hex
          *.bin
