name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QMK CLI & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qmk pyserial pillow
          qmk setup --yes
          pip install -r requirements.txt
          # Verify imports are visible to the current Python environment
          python -c "import pyserial, PIL; print('✅ Dependencies verified')"

      - name: Build Vial Firmware
        run: qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial
        env:
          # Force QMK CLI to see packages installed by GitHub Actions Python
          PYTHONPATH: ${{ env.pythonLocation }}/lib/python3.12/site-packages:${{ env.PYTHONPATH }}

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
