name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Environment & Compile (Single Context)
        run: |
          set -e
          # 1. System toolchain
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi dfu-util avrdude avr-libc gcc-avr

          # 2. QMK CLI & Python deps (user-space to avoid PEP 668 blocks)
          python3 -m pip install --user --break-system-packages qmk pyserial pillow

          # 3. Force PATH visibility for this shell session
          export PATH="$HOME/.local/bin:$PATH"

          # 4. Verify CLI is reachable before make
          which qmk
          qmk --version

          # 5. Initialize ~/.qmk to satisfy Makefile pre-flight
          qmk setup --yes

          # 6. Compile firmware
          make bastardkb/charybdis/4x6/v2/splinky_2:vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
