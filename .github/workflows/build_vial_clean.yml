name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Initialize QMK CLI environment
        run: qmk setup --yes

      - name: Build firmware
        run: qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
