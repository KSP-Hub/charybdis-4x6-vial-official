name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Stable QMK CLI & Compile
        run: |
          python -m pip install --upgrade pip
          pip install qmk==1.1.5 milc==1.9.1 pyserial pillow

          # Bypass udev permission error in CI
          sudo mkdir -p /run/udev/rules.d
          sudo touch /run/udev/rules.d/90-netplan.rules

          qmk setup --yes

          # Force PYTHONPATH to ensure dependency checker sees packages
          export PYTHONPATH="/opt/hostedtoolcache/Python/3.10.20/x64/lib/python3.10/site-packages:$PYTHONPATH"

          qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
