name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install QMK CLI & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install qmk==1.1.5 milc==1.9.1 pyserial pillow

      - name: Create dummy udev rule to bypass permission error
        run: |
          sudo mkdir -p /etc/udev/rules.d
          echo "# Dummy rule for QMK CI" | sudo tee /etc/udev/rules.d/90-netplan.rules > /dev/null
          sudo chmod 644 /etc/udev/rules.d/90-netplan.rules

      - name: Compile Firmware
        env:
          QMK_SKIP_DEPENDENCY_CHECK: "1"
        run: |
          qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
