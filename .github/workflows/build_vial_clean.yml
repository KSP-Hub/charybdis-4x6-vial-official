name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Setup Toolchain & Compile (CLI Bypass)
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi dfu-util avrdude avr-libc gcc-avr make git python3

          mkdir -p ~/.local/bin
          printf '#!/bin/bash\necho "QMK stub for CI"\nexit 0\n' > ~/.local/bin/qmk
          chmod +x ~/.local/bin/qmk
          export PATH="$HOME/.local/bin:$PATH"

          qmk hello
          git config --global --add safe.directory $(pwd)
          make bastardkb/charybdis/4x6/v2/splinky_2:vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
