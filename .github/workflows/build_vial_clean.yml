name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Compile
        run: |
          set -e

          # 1. System toolchain
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi dfu-util avrdude avr-libc gcc-avr make git

          # 2. Python dependencies
          pip install --upgrade pip
          pip install qmk==1.1.5 milc==1.9.1 pyserial pillow

          # 3. Explicitly export paths to ensure visibility
          export PATH="$HOME/.local/bin:$PATH"
          export PYTHONPATH="/opt/hostedtoolcache/Python/3.10.20/x64/lib/python3.10/site-packages:$PYTHONPATH"

          # 4. Verify installation
          which qmk
          qmk --version

          # 5. Initialize QMK home (creates ~/.qmk)
          qmk setup --yes

          # 6. Compile using make directly (bypasses qmk compile dependency check)
          git config --global --add safe.directory $(pwd)
          make bastardkb/charybdis/4x6/v2/splinky_2:vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
