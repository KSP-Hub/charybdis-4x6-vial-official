name: Build 4x6 Vial Clean
on: [workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-vial:
    name: Build Charybdis 4x6 Vial
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build Firmware
        env:
          QMK_SKIP_DEPENDENCY_CHECK: "true"
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi dfu-util avrdude avr-libc gcc-avr

          pip config set global.break-system-packages true
          python3 -m pip install qmk pyserial pillow

          export PATH="$HOME/.local/bin:$PATH"
          qmk setup --yes

          git config --global --add safe.directory $(pwd)
          qmk compile -kb bastardkb/charybdis/4x6/v2/splinky_2 -km vial

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Charybdis_4x6_Vial_firmware
          path: |
            *.uf2
            *.hex
            *.bin
          if-no-files-found: error
